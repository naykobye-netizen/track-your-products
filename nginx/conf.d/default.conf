server {
    listen 443 ssl;
    server_name trackyourproducts.duckdns.org www.trackyourproducts.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/trackyourproducts.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackyourproducts.duckdns.org/privkey.pem;

    # Enrutar todas las peticiones que empiecen por /api hacia el backend de Django
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enrutar el resto de peticiones hacia el frontend de Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}