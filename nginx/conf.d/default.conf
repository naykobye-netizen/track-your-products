server {
    listen 443 ssl;
    server_name trackyourproducts.duckdns.org www.trackyourproducts.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/trackyourproducts.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackyourproducts.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name trackyourbackend.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/trackyourbackend.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackyourbackend.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}